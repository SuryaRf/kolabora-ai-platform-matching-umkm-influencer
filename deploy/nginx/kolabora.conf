# ============================================================================
# Kolabora — server nginx (HTTP). Sertifikat HTTPS ditambahkan oleh certbot:
#   bash scripts/setup-nginx.sh --domain kolabora.tech --port 3050
#
# Jangan edit file ini langsung di /etc/nginx — ubah template ini lalu jalankan
# naskahnya, supaya perubahan tidak hilang saat deploy berikutnya.
#
# Catatan:
# - Placeholder __DOMAIN__ / __PORT__ diisi oleh scripts/setup-nginx.sh.
# - Header X-Forwarded-* dibaca NextAuth (AUTH_TRUST_HOST=true) supaya cookie
#   aman & URL balik-ke-laman benar saat di belakang proxy.
# ============================================================================

# Dukungan websocket/SSE untuk notifikasi & chat. Nama variabel dibuat khas
# Kolabora agar tidak bentrok bila situs lain sudah mendefinisikan map serupa.
map $http_upgrade $kolabora_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN__ www.__DOMAIN__;

    access_log /var/log/nginx/kolabora.access.log;
    error_log  /var/log/nginx/kolabora.error.log;

    # Unggahan gambar/portofolio dibatasi 8 MB di aplikasi (/api/upload);
    # nginx menolak lebih besar dari 12 MB sebelum request menyentuh Node.
    client_max_body_size 12m;

    # Tantangan HTTP-01 Let's Encrypt dilayani dari sini, bukan dari aplikasi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $kolabora_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        # Pemanggilan AI (DeepSeek) bisa memakan 30-60 detik.
        proxy_buffering off;
    }

    # Berkas build Next.js diberi hash pada namanya → boleh di-cache sangat lama.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
